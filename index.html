<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>🌸 Cute Throw Showdown 🎀</title>
</head>
<body>
  <div class="container">
    <h1>🎀 Cute Throw Showdown ✂️</h1>
    
    <div class="choices">
        <button class="choice-btn" data-choice="rock">🪨</button>
        <button class="choice-btn" data-choice="paper">📜</button>
        <button class="choice-btn" data-choice="scissors">✂️</button>
    </div>

    <div id="result">Let's Play! 🌸 Choose your move</div>

    <div id="score">
        <div class="score-item">You: <span id="player-score">0</span> 🍪</div>
        <div class="score-item">Computer: <span id="computer-score">0</span> 🎀</div>
    </div>

    <button id="reset-btn">🔄 Reset Game</button>
</div>

    <script src="script.js"></script>
</body>
</html>
